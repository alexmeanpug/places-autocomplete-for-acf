name: Update WordPress.org readme and assets

# Updates readme.txt and .wordpress-org/ images on WordPress.org without a new release.
on:
  push:
    branches:
      - main
    paths:
      - "readme.txt"
      - ".wordpress-org/**"

jobs:
  assets:
    name: Push readme and assets to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update readme and assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: places-autocomplete-for-acf
          IGNORE_OTHER_FILES: true
